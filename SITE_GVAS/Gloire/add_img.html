<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif, Arial, sans-serif;
        }

        #openModal {
            padding: 12px 20px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgb(231, 228, 228);

            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 650px;
            color: white;

            border-radius: 20px;
            padding: 25px;

            box-shadow: 0 0 20px rgba(243, 255, 69, 0.4);

            /* animation: show .3s ease; */
        }

        .modal-content:hover {
            box-shadow: 0 0 20px yellow;
        }

        .buttons {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        .buttons button {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        @keyframes show {
            from {
                transform: scale(.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form div {
            background-image: radial-gradient(circle at center center, transparent 0%,rgb(33,33,33) 99%),repeating-linear-gradient(0deg, rgba(163, 163, 163,0.2) 0px, rgba(163, 163, 163,0.2) 1px,transparent 1px, transparent 6px),repeating-linear-gradient(90deg, rgba(163, 163, 163,0.2) 0px, rgba(163, 163, 163,0.2) 1px,transparent 1px, transparent 6px),linear-gradient(90deg, rgb(33,33,33),rgb(33,33,33));
        }

        section button {
            border-radius: 7px;
        }

        input {
            border: 1px solid white;
            padding: 10px;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>


    <section>
        <button id="openModal">insérez de nouvelles images</button>

        <form id="modal" class="modal">
            <div class="modal-content">

                <label>Selectionnez les images à publier</label>

                <input type="file" multiple>

                <div class="footer">
                    <button id="closeModal">Cancel</button>
                    <button type="submit">Upload Files</button>
                </div>
            </div>
        </form>
    </section>

    <script>
        const modal = document.getElementById("modal");
        const openBtn = document.getElementById("openModal");
        const closeBtn = document.getElementById("closeModal");

        openBtn.addEventListener("click", () => {
            modal.style.display = "flex";
        });

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });

        // Fermer en cliquant à l'extérieur

        window.addEventListener("click", (e) => {

            if (e.target === modal) {
                modal.style.display = "none";
            }

        });
    </script>
</body>

</html>
